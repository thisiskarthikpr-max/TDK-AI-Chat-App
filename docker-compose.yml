services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/tdk-ai-chat
      CLIENT_ORIGIN: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      CHAT_STREAM_RATE_LIMIT_MAX: ${CHAT_STREAM_RATE_LIMIT_MAX:-20}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-15000}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
