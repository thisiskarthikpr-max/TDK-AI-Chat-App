# Docker's embedded DNS resolver lets nginx refresh the api service's address
# set after Compose scales or replaces containers.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format upstreamlog '$remote_addr - $host "$request" $status '
                       'upstream=$upstream_addr upstream_status=$upstream_status';
access_log /var/log/nginx/access.log upstreamlog;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
